    </g>
    <g transform="translate(1020 300)">
      <rect width="318" height="270" rx="14" fill="#b2c8d2"/><rect y="175" width="318" height="95" fill="#aebdc1"/>
      <path d="M0 214 L62 91 L112 194 L167 64 L233 191 L282 108 L318 185 L318 270 L0 270Z" fill="#8c9fa7"/><path d="M39 136 L62 91 L85 139 L65 127 L58 115 L52 130Z M145 119 L167 64 L194 125 L171 107Z" fill="#f0f5f4"/>
      <text x="18" y="239" class="name">Tundra</text><text x="18" y="258" class="cap">Cold ground · ice and stone</text>
    </g>
  </g>
  <text x="64" y="785" font-family="system-ui,sans-serif" font-size="13" fill="#8399aa">Generated map output is deterministic: the same terrain settings and seed produce the same feature layout.</text>
</svg>
