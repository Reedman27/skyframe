      <text x="18" y="239" class="name">Coast</text><text x="18" y="258" class="cap">Shoreline · water and land contrast</text>
    </g>
    <g transform="translate(680 300)">
      <rect width="318" height="270" rx="14" fill="#8cb5d0"/><rect y="155" width="318" height="115" fill="#367f9e"/>
      <path d="M38 190 L94 112 L142 187 L188 131 L261 194 L261 227 L38 227Z" fill="#7da28a"/><path d="M0 228 Q100 207 180 230 Q249 207 318 225 V270 H0Z" fill="#286d8b"/>
