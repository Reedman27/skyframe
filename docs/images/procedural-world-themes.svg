<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">Skyframe procedural world themes</title>
  <desc id="desc">An illustrative overview of the terrain themes currently generated by the Skyframe simulation: mountains, hills, plains, desert, city, coast, ocean and tundra. These are design illustrations, not in-game screenshots.</desc>
  <defs>
    <linearGradient id="back" x2="0" y2="1"><stop stop-color="#111d2a"/><stop offset="1" stop-color="#071018"/></linearGradient>
    <style>
      .h{font:700 34px system-ui,sans-serif;fill:#eef5fb}.sub{font:16px system-ui,sans-serif;fill:#a8bac9}.name{font:700 17px system-ui,sans-serif;fill:#f5f8fb}.cap{font:12px system-ui,sans-serif;fill:#bed0dc}
    </style>
  </defs>
  <rect width="1440" height="820" rx="26" fill="url(#back)"/>
  <text x="64" y="72" class="h">Procedural world themes</text>
  <text x="64" y="105" class="sub">Illustrative palette guide for the seeded map generator — not captured gameplay screenshots.</text>
  <g transform="translate(54 145)">
    <g>
      <rect width="318" height="270" rx="14" fill="#78909a"/><rect y="176" width="318" height="94" rx="0" fill="#677d61"/>
      <path d="M0 210 L74 77 L123 147 L190 40 L268 170 L318 112 L318 270 L0 270Z" fill="#59656a"/><path d="M151 115 L190 40 L229 133 L199 119 L187 91 L176 122Z" fill="#d8e0df"/>
      <text x="18" y="239" class="name">Mountains</text><text x="18" y="258" class="cap">High ridgelines · rocky peaks</text>
    </g>
    <g transform="translate(340 0)">
      <rect width="318" height="270" rx="14" fill="#9cb9ce"/><rect y="178" width="318" height="92" fill="#71935d"/>
      <path d="M0 202 Q55 105 116 174 Q175 75 242 167 Q286 120 318 176 L318 270 L0 270Z" fill="#769c64"/><path d="M0 225 Q75 157 140 219 Q228 145 318 217 L318 270 L0 270Z" fill="#537b54"/>
      <text x="18" y="239" class="name">Hills</text><text x="18" y="258" class="cap">Rolling terrain · green slopes</text>
    </g>
    <g transform="translate(680 0)">
      <rect width="318" height="270" rx="14" fill="#9bc4df"/><rect y="184" width="318" height="86" fill="#a1b96d"/>
      <path d="M0 210 Q80 186 142 200 Q215 174 318 202 L318 270 L0 270Z" fill="#89a75e"/><path d="M12 177 L52 148 L84 177 M215 179 L245 156 L276 181" stroke="#597b4e" stroke-width="8" fill="none"/>
      <text x="18" y="239" class="name">Plains</text><text x="18" y="258" class="cap">Open fields · sparse tree groups</text>
    </g>
    <g transform="translate(1020 0)">
      <rect width="318" height="270" rx="14" fill="#e0b878"/><rect y="184" width="318" height="86" fill="#c49a58"/>
      <path d="M0 205 Q61 100 142 178 Q220 103 318 191 L318 270 L0 270Z" fill="#d5a55e"/><path d="M0 231 Q66 159 147 224 Q238 144 318 218 L318 270 L0 270Z" fill="#b98749"/>
      <text x="18" y="239" class="name">Desert</text><text x="18" y="258" class="cap">Dune forms · warm sand palette</text>
    </g>
    <g transform="translate(0 300)">
      <rect width="318" height="270" rx="14" fill="#9bbbd0"/><rect y="175" width="318" height="95" fill="#59785f"/>
      <path d="M0 270 V185 H52 V129 H98 V167 H147 V92 H203 V169 H251 V119 H290 V176 H318 V270Z" fill="#60717c"/>
      <g fill="#f0bd6d"><rect x="66" y="143" width="13" height="13"/><rect x="164" y="110" width="14" height="14"/><rect x="266" y="137" width="12" height="12"/></g>
      <text x="18" y="239" class="name">City</text><text x="18" y="258" class="cap">Procedural building clusters</text>
    </g>
    <g transform="translate(340 300)">
      <rect width="318" height="270" rx="14" fill="#9bbbd2"/><rect y="182" width="318" height="88" fill="#4b8aa1"/>
      <path d="M0 198 Q73 156 129 191 Q195 135 318 183 L318 270 L0 270Z" fill="#78966a"/><path d="M0 214 Q55 196 106 214 Q158 195 221 215 L221 270 L0 270Z" fill="#c2b58c"/>
