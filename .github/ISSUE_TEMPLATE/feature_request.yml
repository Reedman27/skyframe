name: Feature request
description: Suggest a player-facing improvement.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Describe the gameplay or usability problem, not just the implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain what the player should be able to do.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Mention other approaches you considered.
  - type: checkboxes
    id: fit
    attributes:
      label: Project direction
      options:
        - label: This can fit the lightweight, offline-first desktop sandbox.
        - label: I understand that online features and a second engine language are not current priorities.
