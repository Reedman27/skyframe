name: Bug report
description: Report a reproducible problem in Skyframe.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first. Remove usernames, tokens, and private data from logs before posting.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: A clear description of the problem.
      placeholder: Describe the unexpected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the exact steps and aircraft/map/weather settings, if relevant.
      placeholder: |
        1. Start Skyframe...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Fedora Linux 45
    validations:
      required: true
  - type: input
    id: compiler
    attributes:
      label: Compiler and version
      placeholder: GCC 14.2
  - type: input
    id: raylib
    attributes:
      label: raylib version (desktop issues)
      placeholder: 5.5
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove private information before posting.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed passwords, tokens, and personal data from attached logs.
          required: true
